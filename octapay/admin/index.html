<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OctaPay Admin Panel</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
    header { background: #1a1a2e; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #6c63ff; }
    header h1 { color: #6c63ff; font-size: 20px; }
    #loginBox { max-width: 360px; margin: 100px auto; background: #1a1a2e; padding: 36px; border-radius: 12px; border: 1px solid #2a2a4a; }
    #loginBox h2 { color: #6c63ff; margin-bottom: 20px; }
    input { width: 100%; padding: 11px 14px; margin-bottom: 14px; background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 8px; color: #e0e0e0; font-size: 14px; }
    input:focus { outline: none; border-color: #6c63ff; }
    button { cursor: pointer; border: none; border-radius: 8px; font-weight: 600; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
    #btnLogin { width: 100%; background: #6c63ff; color: white; padding: 12px; font-size: 15px; }
    #logoutBtn { background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b; padding: 7px 16px; font-size: 13px; }
    #loginError { color: #ff6b6b; font-size: 13px; margin-top: 8px; }
    #dashboard { display: none; padding: 24px 28px; }
    .stats { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 10px; padding: 16px 22px; flex: 1; min-width: 130px; }
    .stat-card p { font-size: 12px; color: #888; margin-bottom: 6px; }
    .stat-card h2 { font-size: 26px; color: #6c63ff; }
    .tabs { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab { background: #1a1a2e; color: #888; border: 1px solid #2a2a4a; padding: 7px 18px; border-radius: 20px; font-size: 13px; }
    .tab.active { background: #6c63ff; color: white; border-color: #6c63ff; }
    #requestsList { display: flex; flex-direction: column; gap: 12px; }
    .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 10px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .card.pending  { border-left: 4px solid #ff9800; }
    .card.approved { border-left: 4px solid #4caf50; }
    .card.rejected { border-left: 4px solid #f44336; }
    .card-info h3 { font-size: 15px; margin-bottom: 4px; }
    .card-info p  { font-size: 12px; color: #888; margin-top: 2px; }
    .card-amount { font-size: 22px; font-weight: 700; color: #6c63ff; min-width: 90px; text-align: center; }
    .card-right { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
    .badge.pending  { background: #ff980022; color: #ff9800; }
    .badge.approved { background: #4caf5022; color: #4caf50; }
    .badge.rejected { background: #f4433622; color: #f44336; }
    .actions { display: flex; gap: 8px; }
    .btn-approve { background: #4caf50; color: white; padding: 8px 16px; font-size: 13px; }
    .btn-reject  { background: #f44336; color: white; padding: 8px 16px; font-size: 13px; }
    #emptyMsg { text-align: center; color: #555; padding: 40px; font-size: 14px; }
    #toastBox { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
    .toast { background: #1a1a2e; border: 1px solid #2a2a4a; padding: 12px 18px; border-radius: 8px; font-size: 13px; animation: fadeIn 0.3s ease; }
    .toast.success { border-left: 4px solid #4caf50; }
    .toast.error   { border-left: 4px solid #f44336; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; } }
  </style>
</head>
<body>

<div id="loginBox">
  <h2>🔐 OctaPay Admin</h2>
  <input type="email" id="adminEmail" placeholder="Admin Email"/>
  <input type="password" id="adminPassword" placeholder="Password"/>
  <button id="btnLogin">Login</button>
  <p id="loginError"></p>
</div>

<header id="mainHeader" style="display:none">
  <h1>⚡ OctaPay Admin Panel</h1>
  <div style="display:flex;align-items:center;gap:14px">
    <span id="adminEmailDisplay" style="font-size:13px;color:#888"></span>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<div id="dashboard">
  <div class="stats">
    <div class="stat-card"><p>Pending</p><h2 id="statPending">0</h2></div>
    <div class="stat-card"><p>Approved Today</p><h2 id="statApproved">0</h2></div>
    <div class="stat-card"><p>Rejected Today</p><h2 id="statRejected">0</h2></div>
    <div class="stat-card"><p>Total</p><h2 id="statTotal">0</h2></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="filterRequests('pending', event)">Pending</button>
    <button class="tab" onclick="filterRequests('approved', event)">Approved</button>
    <button class="tab" onclick="filterRequests('rejected', event)">Rejected</button>
    <button class="tab" onclick="filterRequests('all', event)">All</button>
  </div>
  <div id="requestsList"><p style="color:#555;padding:20px">Loading...</p></div>
</div>

<div id="toastBox"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDfNlnkiBG21m0gxQAY3Vd6G2gokc2baCg",
    authDomain: "octapay-55da7.firebaseapp.com",
    projectId: "octapay-55da7",
    storageBucket: "octapay-55da7.firebasestorage.app",
    messagingSenderId: "1087054840633",
    appId: "1:1087054840633:web:1f6359526a069d9c335ee8"
  };

  firebase.initializeApp(firebaseConfig);
  const db   = firebase.firestore();
  const auth = firebase.auth();

  let allRequests   = [];
  let currentFilter = 'pending';

  document.getElementById('btnLogin').onclick = () => {
    const email = document.getElementById('adminEmail').value.trim();
    const pass  = document.getElementById('adminPassword').value.trim();
    document.getElementById('loginError').textContent = '';
    if (!email || !pass) { document.getElementById('loginError').textContent = 'Fill both fields.'; return; }
    auth.signInWithEmailAndPassword(email, pass)
        .catch(err => { document.getElementById('loginError').textContent = err.message; });
  };

  document.getElementById('logoutBtn').onclick = () => auth.signOut();

  auth.onAuthStateChanged(user => {
if (user) {
      // ✅ Only admin can access
      if (user.email !== 'dwivediamol455@gmail.com') {
        auth.signOut();
        document.getElementById('loginError').textContent = 'Access denied. Admins only.';
        return;
      }
      document.getElementById('loginBox').style.display   = 'none';
      document.getElementById('mainHeader').style.display = 'flex';
      document.getElementById('dashboard').style.display  = 'block';
      document.getElementById('adminEmailDisplay').textContent = user.email;
      listenToRequests();
    } else {
      document.getElementById('loginBox').style.display   = 'block';
      document.getElementById('mainHeader').style.display = 'none';
      document.getElementById('dashboard').style.display  = 'none';
    }
  });

  function listenToRequests() {
    db.collection('balance_requests')
      .orderBy('timestamp', 'desc')
      .onSnapshot(snap => {
        allRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        updateStats();
        renderRequests();
      }, err => showToast('Error: ' + err.message, 'error'));
  }

  function updateStats() {
    const today = new Date().toDateString();
    let pending = 0, approved = 0, rejected = 0;
    allRequests.forEach(r => {
      if (r.status === 'pending') pending++;
      const d = r.timestamp?.toDate?.()?.toDateString?.();
      if (r.status === 'approved' && d === today) approved++;
      if (r.status === 'rejected' && d === today) rejected++;
    });
    document.getElementById('statPending').textContent  = pending;
    document.getElementById('statApproved').textContent = approved;
    document.getElementById('statRejected').textContent = rejected;
    document.getElementById('statTotal').textContent    = allRequests.length;
  }

  function filterRequests(filter, e) {
    currentFilter = filter;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (e) e.target.classList.add('active');
    renderRequests();
  }

  function renderRequests() {
    const list = document.getElementById('requestsList');
    const data = currentFilter === 'all'
      ? allRequests
      : allRequests.filter(r => r.status === currentFilter);

    if (!data.length) {
      list.innerHTML = `<div id="emptyMsg">No ${currentFilter} requests.</div>`;
      return;
    }

    list.innerHTML = data.map(r => {
      const date      = r.timestamp?.toDate?.()?.toLocaleString?.() ?? '—';
      const isPending = r.status === 'pending';
      // ✅ using 'uid' to match your Firestore field
      const userId    = r.uid ?? r.userId ?? null;
      return `
        <div class="card ${r.status}">
          <div class="card-info">
            <h3>${r.userName ?? r.name ?? 'Unknown User'}</h3>
            <p>User ID: ${userId ?? '—'}</p>
            <p>UTR: ${r.utr ?? '—'}</p>
            <p>${date}</p>
          </div>
          <div class="card-amount">₹${r.amount}</div>
          <div class="card-right">
            <span class="badge ${r.status}">${r.status.toUpperCase()}</span>
            ${isPending && userId ? `
              <div class="actions">
                <button class="btn-approve" onclick="handleRequest('${r.id}','${userId}',${r.amount},'approve')">✅ Approve</button>
                <button class="btn-reject"  onclick="handleRequest('${r.id}','${userId}',${r.amount},'reject')">❌ Reject</button>
              </div>` : isPending ? `<p style="color:#ff6b6b;font-size:12px">Missing user ID</p>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  async function handleRequest(reqId, userId, amount, action) {
    try {
      if (action === 'approve') {
        const userSnap = await db.collection('users').doc(userId).get();
        if (!userSnap.exists) { showToast('User not found in Firestore!', 'error'); return; }
        const currentBalance = userSnap.data()?.balance ?? 0;

        const batch = db.batch();
        batch.update(db.collection('users').doc(userId), {
          balance: currentBalance + amount
        });
        batch.update(db.collection('balance_requests').doc(reqId), {
          status:     'approved',
          approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
          approvedBy: auth.currentUser.email
        });
        await batch.commit();
        showToast(`✅ Approved ₹${amount} — balance updated!`, 'success');
      } else {
        await db.collection('balance_requests').doc(reqId).update({
          status:     'rejected',
          rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
          rejectedBy: auth.currentUser.email
        });
        showToast('❌ Request rejected.', 'error');
      }
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  function showToast(msg, type = 'success') {
    const box = document.getElementById('toastBox');
    const t   = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }
</script>
</body>
</html>
